services:
  db:
    # pgvector rather than plain postgres:16 — the knowledge base stores
    # embeddings in the same database as everything else, so retrieval needs no
    # extra service. Same PG16 underneath, so the data directory is unchanged.
    image: pgvector/pgvector:pg16
    container_name: voice-crm-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: voice_crm
    # 5432 and 5433 are taken by the food-compliance and whatsapp-ea projects.
    ports:
      - "5434:5432"
    volumes:
      - voice-crm-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d voice_crm"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  voice-crm-pgdata:
